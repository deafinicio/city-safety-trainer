<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101813">
  <meta name="description" content="Браузерний 3D-тренажер із безпечної поведінки у міському середовищі.">
  <title>Безпечне місто — навчальний тренажер</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app" id="app">
    <section class="screen screen--active" id="start-screen" aria-labelledby="game-title">
      <p class="eyebrow">Інтерактивний 3D-тренажер</p>
      <h1 id="game-title">Безпечне місто</h1>
      <p class="lead">
        Оглядайте середовище, самостійно розпізнавайте загрози
        та обирайте безпечніший алгоритм дій.
      </p>

      <div class="stage-list" aria-label="Доступні навчальні етапи">
        <button class="stage-card" id="stage-01-button" type="button">
          <span>Етап 1</span>
          <strong>Зруйнований сектор і завали</strong>
          <small>Вибір безпечнішого маршруту</small>
        </button>

        <button class="stage-card" id="stage-02-button" type="button">
          <span>Етап 2</span>
          <strong>Дистанційне мінування</strong>
          <small>Виявлення міни, зупинка та повідомлення</small>
        </button>

        <button class="stage-card" id="stage-03-button" type="button">
          <span>Етап 3</span>
          <strong>Офіційний знак «МІНИ»</strong>
          <small>Зупинка та вибір безпечнішого обходу</small>
        </button>

        <button class="stage-card" id="stage-04-button" type="button">
          <span>Етап 4</span>
          <strong>Неофіційне попередження</strong>
          <small>Розпізнавання непрямих ознак і повернення назад</small>
        </button>

        <button class="stage-card" id="stage-05-button" type="button">
          <span>Етап 5</span>
          <strong>Зворотна сторона знака</strong>
          <small>Повна зупинка без спроб самостійного виходу</small>
        </button>

        <button class="stage-card" id="stage-06-button" type="button">
          <span>Етап 6</span>
          <strong>Покинутий рюкзак</strong>
          <small>Відхід на безпечну відстань і виклик екстреної служби</small>
        </button>

        <button class="stage-card" id="stage-07-button" type="button">
          <span>Етап 7</span>
          <strong>Автомобіль у мінному полі</strong>
          <small>Залишитися в салоні та повідомити 101</small>
        </button>

        <button class="stage-card" id="stage-08-button" type="button">
          <span>Етап 8</span>
          <strong>Повітряна загроза у дворі</strong>
          <small>Зупинка, оцінка ситуації та перехід до під’їзду</small>
        </button>
      </div>
    </section>

    <section class="screen screen--game" id="scene-screen" aria-label="Тренувальна 3D-сцена">
      <canvas id="game-canvas" aria-label="Тривимірне міське середовище"></canvas>

      <div class="game-hud">
        <div class="mission">
          <span class="mission__label" id="mission-label"></span>
          <strong id="mission-instruction"></strong>
        </div>
        <button class="hud-button" id="exit-button" type="button">Вийти</button>
      </div>

      <button class="action-control" id="action-button" type="button" hidden></button>

      <div class="desktop-hint" id="desktop-hint">
        <strong>WASD</strong> — рух · <strong>миша</strong> — огляд · <strong>E</strong> — дія
      </div>

      <div class="crosshair" aria-hidden="true"></div>
      <div class="look-zone" id="look-zone" aria-label="Зона сенсорного огляду"></div>

      <div class="joystick" id="joystick" aria-label="Сенсорний джойстик">
        <div class="joystick__knob" id="joystick-knob"></div>
      </div>

      <div class="mobile-hint" id="mobile-hint">Ліворуч — рух · праворуч — огляд</div>

      <section class="dialogue-panel" id="dialogue-panel" hidden aria-live="polite">
        <p class="eyebrow" id="dialogue-title"></p>
        <h2 id="dialogue-prompt"></h2>
        <div class="dialogue-options" id="dialogue-options"></div>
      </section>

      <section class="scenario-feedback" id="failure-panel" hidden aria-live="assertive">
        <span class="scenario-feedback__icon" aria-hidden="true">!</span>
        <p class="eyebrow">Небезпека</p>
        <h2>Обрано небезпечний алгоритм дій</h2>
        <p id="failure-reason"></p>
        <p class="feedback-guidance" id="failure-guidance"></p>
        <button class="button button--primary" id="retry-button" type="button">
          Повторити епізод
        </button>
      </section>
    </section>

    <section class="screen" id="result-screen" aria-labelledby="result-title">
      <p class="eyebrow" id="result-label"></p>
      <h2 id="result-title"></h2>
      <p class="lead" id="result-message"></p>
      <dl class="result-metrics" id="result-metrics"></dl>

      <div class="result-actions">
        <button class="button button--primary" id="next-button" type="button">
          Наступний етап
        </button>
        <button class="button button--secondary" id="restart-button" type="button">
          Пройти ще раз
        </button>
        <button class="button button--ghost" id="menu-button" type="button">
          До списку етапів
        </button>
      </div>
    </section>
  </main>

  <noscript>Для роботи тренажера потрібно ввімкнути JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
